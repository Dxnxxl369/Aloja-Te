name: Build Android APK

on:
  push:
    branches: [ "Daniel", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app-movil

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        run: |
          echo "" | base64 --decode > google-services.json
          echo "EXPO_PUBLIC_API_URL=https://aloja-te-admin.duckdns.org" > .env
          echo "EXPO_PUBLIC_RUTA_LOGIN=/api/v1/auth/login" >> .env

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate Native Android Project)
        run: |
          npx expo prebuild --platform android --clean
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' android/app/src/main/AndroidManifest.xml
        env:
          EXPO_PUBLIC_API_URL: https://aloja-te-admin.duckdns.org
          EXPO_PUBLIC_RUTA_LOGIN: /api/v1/auth/login

      - name: Build Standalone Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://aloja-te-admin.duckdns.org
          EXPO_PUBLIC_RUTA_LOGIN: /api/v1/auth/login

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aloja-Te-APK
          path: frontend/app-movil/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
