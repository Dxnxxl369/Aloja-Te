name: Build Android APK

on:
  push:
    branches: [ "Daniel", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app-movil

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore google-services.json
        run: |
          echo "" | base64 --decode > google-services.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aloja-Te-APK
          path: frontend/app-movil/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
