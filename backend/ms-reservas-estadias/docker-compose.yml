version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: alojate-dynamodb-azure
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_azure_data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

volumes:
  dynamodb_azure_data:
    driver: local
