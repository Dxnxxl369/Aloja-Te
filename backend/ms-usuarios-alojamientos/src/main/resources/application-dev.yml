server:
  port: 3001

spring:
  application:
    name: ms-usuarios-alojamientos
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ms1-usuarios}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin369}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
